name: Release ShowPilot Desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm
          - os: macos-15-intel
            label: macos-intel
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep the known-good baseline compiler on Windows. Current Bun is
          # required on macOS so compiled sidecars have a signable Mach-O
          # layout before Tauri applies Developer ID signing.
          bun-version: ${{ runner.os == 'Windows' && '1.1.21' || '1.4.0' }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Prepare Windows baseline Bun runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline.tgz'
          $extract = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline'
          Invoke-WebRequest `
            -Uri 'https://registry.npmjs.org/@oven/bun-windows-x64-baseline/-/bun-windows-x64-baseline-1.1.21.tgz' `
            -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $archive -C $extract
          $runtime = Join-Path $extract 'package/bin/bun.exe'
          "SHOWPILOT_BUN_EXECUTABLE_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/showpilot-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" showpilot-build.keychain
          security default-keychain -s showpilot-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" showpilot-build.keychain
          security set-keychain-settings -t 3600 -u showpilot-build.keychain
          security import "$RUNNER_TEMP/showpilot-certificate.p12" -k showpilot-build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" showpilot-build.keychain
          identity=$(security find-identity -v -p codesigning showpilot-build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/desktop
          args: --ci
          tagName: desktop-v__VERSION__
          releaseName: ShowPilot Desktop v__VERSION__
          releaseBody: See apps/desktop/RELEASE.md for installation and platform details.
          releaseDraft: true
          prerelease: false
