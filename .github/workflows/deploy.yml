# Production deploy of apps/web and apps/landing to Cloudflare Workers.
#
# Runs only after the CI workflow completes successfully for a push to main
# (workflow_run trigger). Never deploys from pull requests or feature
# branches.
#
# D1 MIGRATIONS ARE NEVER AUTO-APPLIED. ShowPilot's migrations are
# hand-written sequential SQL files (apps/web/prisma/migrations/000N_name.sql)
# applied manually with `wrangler d1 execute showpilot-db --remote --file=…`.
# They deliberately do NOT use wrangler's migrations-directory convention, so
# `wrangler d1 migrations apply` cannot track them. Instead, the "Check D1
# migrations" step below compares the numbered SQL files against the
# applied-remote.txt production-application log and FAILS the deploy with
# instructions if any file is unapplied. The numbered sequence is the system
# of record for schema history; the manifest logs production application.
# See DEPLOY.md → "D1 migrations" for the full procedure.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Workers/R2 deploy token (see DEPLOY.md)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not whatever main has
          # moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same ordering constraint as ci.yml: the generated Prisma client is
      # gitignored and the vite build imports it.
      - name: Generate Prisma client
        run: pnpm --filter @showpilot/web db:generate

      - name: Check D1 migrations (fails loudly if any are unapplied)
        run: pnpm --filter @showpilot/web run db:check-production-manifest

      # Check this before either Worker is changed. The landing Worker has a
      # required private R2 binding, and a missing bucket would otherwise make
      # the second deployment fail after the product Worker was already live.
      - name: Check landing release storage
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          bucket_list="$(pnpm exec wrangler r2 bucket list)"
          printf '%s\n' "$bucket_list"
          if ! grep -Eq '^name:[[:space:]]+showpilot-downloads$' <<<"$bucket_list"; then
            echo "::error::Required private R2 bucket showpilot-downloads does not exist."
            echo "Create it once from apps/landing, then rerun this workflow:"
            echo "  pnpm exec wrangler r2 bucket create showpilot-downloads"
            exit 1
          fi

      - name: Capture previous web release
        id: previous_web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deployments list --json > "$RUNNER_TEMP/web-deployments.json"
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const deployments = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/web-deployments.json`, 'utf8'));
          const latest = deployments.sort((a, b) => a.created_on.localeCompare(b.created_on)).at(-1);
          const versions = latest?.versions ?? [];
          if (latest && (versions.length !== 1 || versions[0].percentage !== 100)) {
            throw new Error('Cannot capture a single previous live version; refusing deployment');
          }
          const version = versions[0]?.version_id ?? '';
          let commit = '';
          if (version) {
            const response = await fetch('https://app.showpilot.tech/api/health', {
              cache: 'no-store', signal: AbortSignal.timeout(10_000),
            });
            const health = await response.json();
            if (!response.ok || health.status !== 'ok' || !/^[a-f0-9]{40}$/.test(health.commit)) {
              throw new Error('Cannot capture previous healthy commit; refusing deployment');
            }
            commit = health.commit;
          }
          await appendFile(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\n`);
          NODE

      # Runs the @showpilot/web `deploy` script: vite build && wrangler deploy
      # VITE_* values are build-time publics (repo *variables*, not secrets):
      # unset is fine — analytics no-ops and checkout degrades to hosted.
      - name: Deploy apps/web
        run: pnpm --filter @showpilot/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Verify deployed web commit and record release
        id: verify_web
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const endpoint = 'https://app.showpilot.tech/api/health';
          const expected = process.env.EXPECTED_COMMIT;
          let health;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${endpoint}?release=${expected}`, {
                cache: 'no-store', signal: AbortSignal.timeout(10_000),
              });
              if (response.ok) health = await response.json();
              if (health?.status === 'ok' && health.commit === expected) break;
            } catch (error) {
              console.log(`Health request failed: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5_000));
          }
          if (health?.status !== 'ok' || health.commit !== expected) {
            throw new Error(`Deployment did not serve the CI-approved commit ${expected}; received ${JSON.stringify(health)}`);
          }
          const release = {
            webCommit: expected,
            ciRun: process.env.CI_RUN_URL,
            deployRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            verifiedAt: new Date().toISOString(),
            healthEndpoint: endpoint,
            nativeRelease: 'not included',
          };
          await writeFile('web-release.json', JSON.stringify(release, null, 2) + '\n');
          console.log(JSON.stringify(release, null, 2));
          NODE

      # Migration and landing R2 gates fail before verify_web runs: its outcome
      # is skipped, so neither pre-deploy gate failure triggers rollback.
      - name: Roll back failed web verification
        if: failure() && steps.verify_web.outcome == 'failure'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous_web.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.previous_web.outputs.commit }}
        run: |
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "No previous Worker version (first deploy); rollback is a no-op. Deploy remains failed."
            exit 1
          fi
          if ! pnpm exec wrangler rollback "$PREVIOUS_VERSION" --yes; then
            echo "::error::Worker rollback failed."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const endpoint = 'https://app.showpilot.tech/api/health';
          const expected = process.env.EXPECTED_COMMIT;
          let health;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${endpoint}?release=${expected}`, {
                cache: 'no-store', signal: AbortSignal.timeout(10_000),
              });
              if (response.ok) health = await response.json();
              if (health?.status === 'ok' && health.commit === expected) break;
            } catch (error) {
              console.log(`Health request failed: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5_000));
          }
          if (health?.status !== 'ok' || health.commit !== expected) {
            console.error(`::error::Rollback did not restore commit ${expected}; received ${JSON.stringify(health)}`);
            process.exit(1);
          }
          console.error('::error::Deploy was rolled back and verified; job failed for investigation.');
          process.exit(1);
          NODE

      - name: Save web release manifest
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.event.workflow_run.head_sha }}
          path: web-release.json

      - name: Deploy apps/landing
        run: pnpm --filter @showpilot/landing run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test landing downloads
        run: pnpm --filter @showpilot/landing run smoke -- https://www.showpilot.tech
