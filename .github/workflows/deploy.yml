# Production deploy of apps/web and apps/landing to Cloudflare Workers.
#
# Runs only after the CI workflow completes successfully for a push to main
# (workflow_run trigger). Never deploys from pull requests or feature
# branches.
#
# D1 MIGRATIONS ARE NEVER AUTO-APPLIED. ShowPilot's migrations are
# hand-written sequential SQL files (apps/web/prisma/migrations/000N_name.sql)
# applied manually with `wrangler d1 execute showpilot-db --remote --file=…`.
# They deliberately do NOT use wrangler's migrations-directory convention, so
# `wrangler d1 migrations apply` cannot track them. Instead, the "Check D1
# migrations" step below compares the numbered SQL files against the
# applied-remote.txt manifest and FAILS the deploy with instructions if any
# file is unapplied. See DEPLOY.md → "D1 migrations" for the full procedure.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Workers/R2 deploy token (see DEPLOY.md)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not whatever main has
          # moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same ordering constraint as ci.yml: the generated Prisma client is
      # gitignored and the vite build imports it.
      - name: Generate Prisma client
        run: pnpm --filter @showpilot/web db:generate

      - name: Check D1 migrations (fails loudly if any are unapplied)
        run: pnpm --filter @showpilot/web run db:check-production-manifest

      # Check this before either Worker is changed. The landing Worker has a
      # required private R2 binding, and a missing bucket would otherwise make
      # the second deployment fail after the product Worker was already live.
      - name: Check landing release storage
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          bucket_list="$(pnpm exec wrangler r2 bucket list)"
          printf '%s\n' "$bucket_list"
          if ! grep -Eq '^name:[[:space:]]+showpilot-downloads$' <<<"$bucket_list"; then
            echo "::error::Required private R2 bucket showpilot-downloads does not exist."
            echo "Create it once from apps/landing, then rerun this workflow:"
            echo "  pnpm exec wrangler r2 bucket create showpilot-downloads"
            exit 1
          fi

      # Runs the @showpilot/web `deploy` script: vite build && wrangler deploy
      # VITE_* values are build-time publics (repo *variables*, not secrets):
      # unset is fine — analytics no-ops and checkout degrades to hosted.
      - name: Deploy apps/web
        run: pnpm --filter @showpilot/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Verify deployed web commit and record release
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const endpoint = 'https://showpilot.tech/api/health';
          const expected = process.env.EXPECTED_COMMIT;
          let health;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${endpoint}?release=${expected}`, {
                cache: 'no-store', signal: AbortSignal.timeout(10_000),
              });
              if (response.ok) health = await response.json();
              if (health?.status === 'ok' && health.commit === expected) break;
            } catch (error) {
              console.log(`Health request failed: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5_000));
          }
          if (health?.status !== 'ok' || health.commit !== expected) {
            throw new Error(`Deployment did not serve the CI-approved commit ${expected}; received ${JSON.stringify(health)}`);
          }
          const release = {
            webCommit: expected,
            ciRun: process.env.CI_RUN_URL,
            deployRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            verifiedAt: new Date().toISOString(),
            healthEndpoint: endpoint,
            nativeRelease: 'not included',
          };
          await writeFile('web-release.json', JSON.stringify(release, null, 2) + '\n');
          console.log(JSON.stringify(release, null, 2));
          NODE

      - name: Save web release manifest
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.event.workflow_run.head_sha }}
          path: web-release.json

      - name: Deploy apps/landing
        run: pnpm --filter @showpilot/landing run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test landing downloads
        run: pnpm --filter @showpilot/landing run smoke -- https://www.showpilot.tech
