# CI for the ShowPilot monorepo.
#
# STEP ORDER IS CRITICAL: install → Prisma generate → typecheck → test →
# landing Worker verification.
# The Prisma client is generated into apps/web/src/generated/prisma, which is
# gitignored (see /.gitignore: **/src/generated/). If the "Generate Prisma
# client" step is removed or moved after typechecking, `tsc --noEmit` fails
# with ~61 cascading "Cannot find module '#/generated/prisma/...'" errors that
# look like real type breakage but are just the missing generated client.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in sync with the pnpm version used locally (lockfile v9).
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native release contracts
        run: pnpm native:verify

      - name: Test native release verifier
        run: pnpm native:verify:test

      # MUST run before any typecheck step — see the header comment.
      - name: Generate Prisma client
        run: pnpm --filter @showpilot/web db:generate

      - name: Typecheck web
        run: pnpm --filter @showpilot/web exec tsc --noEmit

      - name: Typecheck bridge
        run: pnpm --filter @showpilot/bridge exec tsc --noEmit

      - name: Test web
        run: pnpm --filter @showpilot/web test

      - name: Test bridge
        run: pnpm --filter @showpilot/bridge test

      - name: Verify React Native app and EAS workflows
        run: pnpm --filter @showpilot/mobile verify

      - name: Verify landing release Worker
        run: pnpm --filter @showpilot/landing run verify

  native:
    name: Native Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check native formatting
        run: |
          cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo fmt --check --manifest-path apps/bridge-desktop/src-tauri/Cargo.toml

      # Unit tests do not exercise bundle assembly. Removing externalBin from
      # the test-only merged config lets Tauri compile the Rust test harness
      # without first producing a platform-specific Bridge executable.
      - name: Test Desktop native engine
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test Bridge native supervisor
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --locked --manifest-path apps/bridge-desktop/src-tauri/Cargo.toml
