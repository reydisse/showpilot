name: Release ShowPilot Bridge

on:
  push:
    tags:
      - "bridge-v*"

permissions:
  contents: write

concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-15-intel
            label: macos-intel
          - os: macos-14
            label: macos-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.3.x currently fails to extract the Windows baseline
          # cross-compile runtime. Pin the known-good compiler until that
          # upstream issue is resolved.
          bun-version: ${{ runner.os == 'Windows' && '1.1.21' || '1.4.0' }}

      - name: Prepare Windows baseline Bun runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline.tgz'
          $extract = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline'
          Invoke-WebRequest `
            -Uri 'https://registry.npmjs.org/@oven/bun-windows-x64-baseline/-/bun-windows-x64-baseline-1.1.21.tgz' `
            -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $archive -C $extract
          $runtime = Join-Path $extract 'package/bin/bun.exe'
          "SHOWPILOT_BUN_EXECUTABLE_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Refusing to publish an unsigned macOS Bridge. Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { console.error('Missing TAURI_SIGNING_PRIVATE_KEY'); process.exit(1) }"

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/bridge-desktop
          args: >-
            --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: bridge-v__VERSION__
          releaseName: ShowPilot Bridge v__VERSION__
          releaseBody: |
            Choose the installer that matches the production computer:

            - **Apple Silicon Mac (M1/M2/M3/M4/M5):** download the `aarch64.dmg` file.
            - **Intel Mac:** download the `x64.dmg` file.
            - **Windows:** download the `.exe` installer (or `.msi` for managed deployment).

            macOS downloads are Developer ID signed and Apple-notarized. Do not install the Intel (`x64`) Mac build on an Apple Silicon Mac. See `apps/bridge-desktop/RELEASE.md` for installation and update details.
          releaseDraft: true
          prerelease: false

      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-macos-release.sh apps/bridge-desktop/src-tauri/target/release/bundle "ShowPilot Bridge"
