name: Verify downloaded native installers
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Exact unsigned build run to download
        required: true
      source_sha:
        description: Expected application source commit
        required: true
      platform:
        description: Installer validation scope
        type: choice
        options: [all, windows]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  install:
    name: Install downloaded bundles (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-latest","label":"windows"}]' || '[{"os":"ubuntu-22.04","label":"linux"},{"os":"windows-latest","label":"windows"},{"os":"macos-15-intel","label":"macos-intel"},{"os":"macos-15","label":"macos-arm"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > build-provenance.json
          python3 -c 'import json,os; p=json.load(open("build-provenance.json")); assert p["headSha"]==os.environ["EXPECTED_SHA"]; assert p["conclusion"]=="success",p'
          git diff --exit-code "$EXPECTED_SHA" -- apps packages pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-bundles-${{ matrix.label }}
          path: downloaded-bundles
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Install Linux runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libasound2 libxdo3 xvfb
      - name: Install Bridge then Desktop and exercise packaged engines
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/verify-downloaded-native-installers.py downloaded-bundles
      - name: Install Linux Bridge then Desktop and exercise packaged engines
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/verify-downloaded-native-installers.py downloaded-bundles
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-install-evidence-${{ matrix.label }}
          retention-days: 14
          path: |
            build-provenance.json
            native-install-evidence
          if-no-files-found: error
