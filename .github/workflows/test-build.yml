name: Supplemental Mac Bridge packaging repair
on:
  workflow_dispatch:
    inputs:
      build_run:
        required: true
        description: Original successful unsigned build run
      source_sha:
        required: true
        description: Pinned application source
permissions:
  contents: read
  actions: read
jobs:
  package:
    name: Repackage existing Bridge (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm
          - os: macos-15-intel
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact original artifact source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > build-provenance.json
          python3 -c 'import json,os; p=json.load(open("build-provenance.json")); assert p["headSha"]==os.environ["EXPECTED_SHA"]; assert p["conclusion"]=="success",p'
          git diff --exit-code "$EXPECTED_SHA" -- apps packages pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-bundles-${{ matrix.label }}
          path: downloaded-bundles
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Repair packaging only and prove executable bytes unchanged
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/repackage-downloaded-macos-bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-supplemental-${{ matrix.label }}-b8f6a705
          path: supplemental-native-bundles
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  verify:
    needs: package
    name: Download and install supplemental bundles (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm
          - os: macos-15-intel
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-supplemental-${{ matrix.label }}-b8f6a705
          path: downloaded-bundles
      - run: pnpm install --frozen-lockfile
      - name: Install downloaded Bridge then Desktop and test actual engines
        run: python3 scripts/verify-downloaded-native-installers.py downloaded-bundles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplemental-install-evidence-${{ matrix.label }}
          path: native-install-evidence
          retention-days: 14
          if-no-files-found: error
