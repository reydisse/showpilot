name: Build Windows Desktop Test

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the unsigned installers as a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-windows-test
  cancel-in-progress: false

jobs:
  build:
    name: Windows unsigned test build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.21

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare Windows baseline Bun runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline.tgz'
          $extract = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline'
          Invoke-WebRequest `
            -Uri 'https://registry.npmjs.org/@oven/bun-windows-x64-baseline/-/bun-windows-x64-baseline-1.1.21.tgz' `
            -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $archive -C $extract
          $runtime = Join-Path $extract 'package/bin/bun.exe'
          "SHOWPILOT_BUN_EXECUTABLE_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native contracts and set release identity
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          pnpm native:verify --product desktop --tag "desktop-v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_TAG=desktop-v$version-test.$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned Windows installers
        run: pnpm --filter @showpilot/desktop exec tauri build --ci --bundles nsis,msi --config ci-windows-test.conf.json

      - name: Verify installers and write checksums
        shell: pwsh
        run: |
          $bundlePath = Resolve-Path 'apps/desktop/src-tauri/target/release/bundle'
          $installers = @(Get-ChildItem $bundlePath -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.msi') })
          if ($installers.Count -lt 2) { throw "Expected NSIS and MSI installers, found $($installers.Count)" }

          $lines = @()
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned test installer, but $($installer.Name) reported $($signature.Status)"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
            $relativePath = [IO.Path]::GetRelativePath($bundlePath, $installer.FullName).Replace('\\', '/')
            $lines += "$hash  $relativePath"
          }

          $checksumPath = Join-Path $bundlePath 'SHA256SUMS.txt'
          [IO.File]::WriteAllLines($checksumPath, $lines, [Text.UTF8Encoding]::new($false))
          "BUNDLE_PATH=$bundlePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: showpilot-desktop-windows-${{ env.DESKTOP_VERSION }}-unsigned-test
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Publish unsigned test prerelease
        if: inputs.publish_prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem $env:BUNDLE_PATH -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.msi') })
          $assets = @($installers | ForEach-Object FullName)
          $assets += Join-Path $env:BUNDLE_PATH 'SHA256SUMS.txt'
          $notes = @"
          Internal Windows test build of ShowPilot Desktop $env:DESKTOP_VERSION.

          WARNING: These installers are intentionally unsigned because the Windows code-signing certificate has not been configured. Windows Defender SmartScreen may warn before installation. Use this prerelease only for ShowPilot testing; it is not the production Windows release and is not included in the ShowPilot updater or download manifest.

          Source commit: $env:GITHUB_SHA
          "@
          & gh release create $env:TEST_TAG --target $env:GITHUB_SHA --title "ShowPilot Desktop $env:DESKTOP_VERSION — Windows test (unsigned)" --notes $notes --prerelease @assets
