<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowPilot · Sign-in studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090b;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px 28px;border-bottom:1px solid #26272b;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:650;letter-spacing:-.5px;font-size:19px}.brand span{color:#ffc107}.meta{color:#868890;font-size:12px;margin-top:5px}nav{display:flex;gap:6px}button{cursor:pointer;font:inherit;color:#aaa;background:transparent;border:1px solid #303137;padding:10px 15px;border-radius:9px}button[aria-pressed=true]{color:#ffe096;border-color:#887239;background:#ffc1070c}button:focus-visible,a:focus-visible{outline:2px solid #ffc107;outline-offset:4px}.controls{display:flex;align-items:center;justify-content:space-between;padding:17px 28px;gap:16px}.note{margin:0;color:#a4a5ad;font-size:13px}.devices{display:flex;gap:7px}.stage{display:flex;justify-content:center;padding:0 24px 22px}iframe{border:1px solid #303137;border-radius:14px;width:100%;height:calc(100dvh - 180px);min-height:620px;background:#101113;transition:width .3s}footer{padding:0 28px 20px;color:#70727b;font-size:12px}a{color:#c7c8cc}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}nav{flex-wrap:wrap}.controls{align-items:flex-start;flex-direction:column}.stage{padding:0 10px 15px}iframe{min-height:760px}.devices button{padding:8px 10px}}
</style>
<header><div><div class="brand"><span>Show</span>Pilot <span style="color:#757780;font-weight:400">/ Sign-in studies</span></div><div class="meta">Three directions · animated previews · October 2026</div></div><nav aria-label="Design concepts"><button data-concept="1" aria-pressed="true">01 · Rhythm</button><button data-concept="2" aria-pressed="false">02 · Afterglow</button><button data-concept="3" aria-pressed="false">03 · In sync</button></nav></header>
<div class="controls"><p class="note" id="description">A quiet geometric panel. Warm tiles turn slowly, like cues falling into place.</p><div class="devices"><button data-width="100%" aria-pressed="true">Desktop</button><button data-width="820px" aria-pressed="false">iPad</button><button data-width="390px" aria-pressed="false">Phone</button><button id="motion" aria-pressed="false">Pause motion</button></div></div>
<div class="stage"><iframe title="Sign-in concept preview" src="concept.html?design=1"></iframe></div><footer>Design preview only · form submissions are disabled · <a href="https://mobbin.com/screens/7230d4dc-11e6-4a38-8b39-58939d79905e" target="_blank" rel="noreferrer">Reference on Mobbin ↗</a></footer>
<script>
const frame=document.querySelector('iframe');const notes=['A quiet geometric panel. Warm tiles turn slowly, like cues falling into place.','A soft pool of stage light. Sculpted rings drift almost imperceptibly beside the form.','A little of the product, brought to life. A cue marker moves gently through a miniature rundown.'];let paused=false;
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-concept]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src='concept.html?design='+b.dataset.concept;document.querySelector('#description').textContent=notes[Number(b.dataset.concept)-1]});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.style.width=b.dataset.width});function setMotion(){frame.contentWindow.postMessage({type:'motion',paused},location.origin)}frame.onload=setMotion;document.querySelector('#motion').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume motion':'Pause motion';e.currentTarget.setAttribute('aria-pressed',String(paused));setMotion()};
</script></html>
