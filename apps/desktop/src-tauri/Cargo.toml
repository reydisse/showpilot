[package]
name = "showpilot-desktop"
version = "0.1.8"
description = "ShowPilot local production engine"
authors = ["ShowPilot"]
edition = "2021"

[lib]
name = "showpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
showpilot-native-credentials = { path = "../../../packages/native-credentials" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
midir = "0.10"
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-notification = "=2.6.0"
tauri-plugin-updater = "2.10.1"
