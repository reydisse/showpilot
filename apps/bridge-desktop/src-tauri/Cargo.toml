[package]
name = "showpilot-bridge-desktop"
version = "0.1.3"
description = "ShowPilot local bridge configuration and supervisor"
authors = ["ShowPilot"]
edition = "2021"

[lib]
name = "showpilot_bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
