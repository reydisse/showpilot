[package]
name = "showpilot-bridge-desktop"
version = "0.1.14"
description = "ShowPilot local bridge configuration and supervisor"
authors = ["ShowPilot"]
edition = "2021"

[lib]
name = "showpilot_bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
showpilot-native-credentials = { path = "../../../packages/native-credentials" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.11.1"
cpal = "0.18.2"
timecode-tools = "=0.1.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
